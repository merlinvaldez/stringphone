name: Android prod APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_API_URL_PRODUCTION: ${{ vars.ANDROID_PROD_API_URL || 'https://stringphone-orcin.vercel.app/api' }}
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run check:api-config
      - run: npm run check:server-boundary
      - run: node ../scripts/verify-mobile-ui-strings.mjs
      - name: Check UI translation catalogs
        run: node ../scripts/check-mobile-ui-catalog.mjs
      - run: npx expo prebuild --platform android --no-install
      - name: Verify production Android identity
        run: |
          grep -Eq "applicationId ['\"]ai\.stringphone\.mobile['\"]" android/app/build.gradle
          ! grep -q "ai.stringphone.mobile.debug" android/app/build.gradle
          grep -Eq "versionCode 8\b" android/app/build.gradle
          grep -Eq "versionName ['\"]1\.0\.7['\"]" android/app/build.gradle
          grep -q '<string name="app_name">StringPhone</string>' android/app/src/main/res/values/strings.xml
      - name: Assemble standalone production APK
        working-directory: mobile/android
        run: ./gradlew app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Prepare download
        run: cp android/app/build/outputs/apk/release/app-release.apk StringPhone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StringPhone-Prod
          path: mobile/StringPhone.apk
          if-no-files-found: error
          retention-days: 14
